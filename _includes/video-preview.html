<figure style="float: right; clear: right; width: 30%; margin: 0 0 1em 1.5em;">
  <a href="{{ include.url }}" aria-label="Watch presentation: {{ page.title | escape }}">
    <img src="{{ include.image }}" alt="{{ include.alt | escape }}"
         style="display: block; width: 100%; height: auto; margin: 0;" loading="lazy">
  </a>
  <figcaption style="margin-top: 0.5em; font-size: 0.9em; line-height: 1.4;">
    <a href="{{ include.url }}">&#9654; Watch my presentation</a>{{ include.note }}
  </figcaption>
</figure>
